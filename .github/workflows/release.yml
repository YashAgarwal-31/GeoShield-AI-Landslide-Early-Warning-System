name: GeoShield Release

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION

permissions:
  contents: write

concurrency:
  group: geoshield-release
  cancel-in-progress: false

jobs:
  android-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Read release version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)" >> "$GITHUB_ENV"

      - name: Build Android evaluation APK
        working-directory: frontend
        env:
          GEOSHIELD_ANDROID_DEV_TRANSPORT: "true"
        run: |
          npm ci
          npm run build
          npx cap add android
          npx cap sync android
          npm run android:debug-transport
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Stage Android asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/GeoShield-v${VERSION}-Android-Evaluation.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: android-release-asset
          path: release-assets/*

  windows-asset:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm ci
          ./scripts/prepare-electron-runtime.ps1
          npx electron-builder --win nsis --x64 --publish never

      - name: Stage Windows asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem "dist-electron/GeoShield-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing." }
          Copy-Item $installer.FullName "release-assets/GeoShield-v$env:VERSION-Setup.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-release-asset
          path: release-assets/*

  linux-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Read release version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)" >> "$GITHUB_ENV"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare bundled Python runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          PYROOT="$(python -c 'import sys; print(sys.prefix)')"
          mkdir -p runtime/python
          cp -a "$PYROOT"/. runtime/python/
          test -x runtime/python/bin/python3

      - name: Build Linux AppImage
        run: |
          npm ci
          npx electron-builder --linux AppImage --x64 --publish never

      - name: Stage Linux asset
        shell: bash
        run: |
          mkdir -p release-assets
          artifact="$(find dist-electron -maxdepth 1 -name '*.AppImage' -type f | head -n 1)"
          test -n "$artifact"
          cp "$artifact" "release-assets/GeoShield-v${VERSION}-Linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-release-asset
          path: release-assets/*

  ios-simulator-asset:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read release version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)" >> "$GITHUB_ENV"

      - name: Generate iOS application
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save @capacitor/ios@8.5.0
          npm run build
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS simulator app
        working-directory: frontend
        shell: bash
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
          fi
          test -d build-ios/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p ../release-assets
          ditto -c -k --sequesterRsrc --keepParent build-ios/Build/Products/Debug-iphonesimulator/App.app "../release-assets/GeoShield-v${VERSION}-iOS-Simulator.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ios-release-asset
          path: release-assets/*

  publish:
    needs:
      - android-asset
      - windows-asset
      - linux-asset
      - ios-simulator-asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: "*-release-asset"
          path: release-assets
          merge-multiple: true

      - name: Read release version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)" >> "$GITHUB_ENV"

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "GeoShield ${TAG} — ACT Emergency Communications" \
              --notes-file docs/RELEASE_NOTES_v1.2.0.md
          fi
