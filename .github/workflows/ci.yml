name: GeoShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geoshield-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: demo
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip check
          python -m compileall -q app

      - name: Verify desktop lockfile and JavaScript
        run: |
          npm ci --ignore-scripts
          npm run verify:desktop
          npm audit --audit-level=high

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Docker build
        run: docker build -t geoshield:ci .

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name geoshield-smoke \
            -p 127.0.0.1:18000:8000 \
            -e APP_ENV=production \
            -e JWT_SECRET=ci-runtime-secret-0123456789abcdef0123456789abcdef \
            -e ENABLE_DEMO_USERS=false \
            -e GEOSHIELD_ADMIN_EMAIL=runtime-admin@example.invalid \
            -e GEOSHIELD_ADMIN_PASSWORD=runtime-ci-admin-password-12345 \
            -e AUTO_SEED_REFERENCE_DATA=true \
            -e WEATHER_LIVE_ENABLED=false \
            -e MODEL_TRAINING_ENABLED=false \
            -e TRUST_PROXY_HEADERS=false \
            geoshield:ci

          cleanup() {
            docker logs geoshield-smoke || true
            docker rm -f geoshield-smoke || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/api/health/ready >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          with open("/tmp/health.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["status"] == "ready", data
          assert data["database"] == "connected", data
          PY

          curl -fsS http://127.0.0.1:18000/ >/tmp/index.html
          grep -qi "<!doctype html" /tmp/index.html

          curl -fsS http://127.0.0.1:18000/api/dashboard/stats >/tmp/dashboard.json
          python - <<'PY'
          import json
          with open("/tmp/dashboard.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["total_stations"] == 20, data
          assert "risk_distribution" in data, data
          PY

          curl -fsS \
            -H "Content-Type: application/json" \
            -d '{"latitude":25.58,"longitude":91.89}' \
            http://127.0.0.1:18000/api/predict >/tmp/predict.json
          python - <<'PY'
          import json
          with open("/tmp/predict.json", encoding="utf-8") as f:
              data = json.load(f)
          assessment = data["risk_assessment"]
          assert 0 <= assessment["risk_score"] <= 100, assessment
          assert assessment["risk_level"] in {"low", "moderate", "high", "critical"}, assessment
          PY

          unauth_code=$(curl -sS -o /tmp/unauth.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"station_id":"NER-001","intensity":"high"}' \
            http://127.0.0.1:18000/api/simulate/landslide)
          test "$unauth_code" = "401"

          demo_login_code=$(curl -sS -o /tmp/login.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "email=admin%40geoshield.gov.in&password=admin123" \
            http://127.0.0.1:18000/api/auth/login)
          test "$demo_login_code" = "401"

          docker inspect -f '{{.State.Running}}' geoshield-smoke | grep -qx true

      - name: Production container smoke test
        shell: bash
        run: |
          set -euo pipefail
          JWT_SECRET_VALUE="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"

          docker run -d --name geoshield-ci \
            -p 127.0.0.1:8000:8000 \
            -e APP_ENV=production \
            -e JWT_SECRET="$JWT_SECRET_VALUE" \
            -e ENABLE_DEMO_USERS=false \
            -e GEOSHIELD_ADMIN_EMAIL=ci-admin@example.invalid \
            -e GEOSHIELD_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e AUTO_SEED_REFERENCE_DATA=true \
            -e WEATHER_LIVE_ENABLED=false \
            -e MODEL_TRAINING_ENABLED=false \
            geoshield:ci

          cleanup() {
            docker logs geoshield-ci || true
            docker rm -f geoshield-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "GeoShield container did not become healthy"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8000/api/dashboard/stats >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/sensors/stations >/dev/null

          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"latitude":25.58,"longitude":91.89}' \
            http://127.0.0.1:8000/api/predict >/dev/null

          curl --fail --silent \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'email=ci-admin@example.invalid' \
            --data-urlencode "password=$ADMIN_PASSWORD" \
            http://127.0.0.1:8000/api/auth/login >/dev/null


  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://geoshield:geoshield_ci@127.0.0.1:5432/geoshield_ci
      JWT_SECRET: ci-postgres-jwt-secret-0123456789abcdef0123456789abcdef
      ENABLE_DEMO_USERS: "false"
      GEOSHIELD_ADMIN_EMAIL: ci-admin@example.invalid
      GEOSHIELD_ADMIN_PASSWORD: StrongCiAdminPassword123!
      GEOSHIELD_ADMIN_NAME: CI Admin
      AUTO_SEED_REFERENCE_DATA: "true"
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      SENSOR_INGEST_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geoshield_ci
          POSTGRES_USER: geoshield
          POSTGRES_PASSWORD: geoshield_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoshield -d geoshield_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip check

      - name: PostgreSQL migration and operational tests
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m pytest tests/test_operational_core.py -q

      - name: Verify persistence across application restart
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          APP_PID=""
          PORT=18081
          BASE="http://127.0.0.1:${PORT}"
          LOG="/tmp/geoshield-persistence.log"

          stop_app() {
            if [ -n "${APP_PID}" ] && kill -0 "${APP_PID}" 2>/dev/null; then
              kill "${APP_PID}"
              wait "${APP_PID}" || true
            fi
            APP_PID=""
          }

          cleanup() {
            stop_app
            cat "${LOG}" || true
          }
          trap cleanup EXIT

          start_app() {
            : >"${LOG}"
            python -m uvicorn app.main:app --host 127.0.0.1 --port "${PORT}" >"${LOG}" 2>&1 &
            APP_PID=$!
            for attempt in $(seq 1 40); do
              if curl -fsS "${BASE}/api/health/ready" >/dev/null; then
                return
              fi
              if ! kill -0 "${APP_PID}" 2>/dev/null; then
                cat "${LOG}"
                exit 1
              fi
              sleep 1
            done
            cat "${LOG}"
            echo "GeoShield did not become ready"
            exit 1
          }

          admin_login() {
            curl -fsS -X POST               -H 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode "email=${GEOSHIELD_ADMIN_EMAIL}"               --data-urlencode "password=${GEOSHIELD_ADMIN_PASSWORD}"               "${BASE}/api/auth/login"
          }

          token_from_json() {
            python -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          }

          start_app
          ADMIN_TOKEN="$(admin_login | token_from_json)"

          curl -fsS -X POST             -H "Authorization: Bearer ${ADMIN_TOKEN}"             -H 'Content-Type: application/json'             -d '{"station_id":"NER-997","name":"Persistence CI Station","latitude":25.60,"longitude":91.90,"state":"Meghalaya","district":"East Khasi Hills","village":"Persistence Village","elevation":1200,"slope_angle":32,"soil_type":"loamy","vegetation_cover":55}'             "${BASE}/api/sensors/stations" >/tmp/persist-station.json

          curl -fsS -X POST             -H "Authorization: Bearer ${ADMIN_TOKEN}"             -H 'Content-Type: application/json'             -d '{"email":"persistence-ci@example.invalid","name":"Persistence Citizen","password":"PersistencePass123!","role":"citizen"}'             "${BASE}/api/users" >/tmp/persist-user.json

          CITIZEN_TOKEN="$(curl -fsS -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'email=persistence-ci@example.invalid'             --data-urlencode 'password=PersistencePass123!'             "${BASE}/api/auth/login" | token_from_json)"

          python - <<'PY'
          from pathlib import Path
          Path("/tmp/persistence-evidence.png").write_bytes(
              b"\x89PNG\r\n\x1a\nGeoShield persistence evidence"
          )
          PY

          curl -fsS -X POST             -H "Authorization: Bearer ${CITIZEN_TOKEN}"             -F 'report_type=crack'             -F 'description=Persistent slope crack report created before application restart'             -F 'latitude=25.58'             -F 'longitude=91.89'             -F 'reporter_name=Persistence Citizen'             -F 'reporter_language=en'             -F 'attachment=@/tmp/persistence-evidence.png;type=image/png'             "${BASE}/api/reports" >/tmp/persist-report.json

          REPORT_ID="$(python -c 'import json; print(json.load(open("/tmp/persist-report.json"))["report"]["id"])')"

          stop_app
          start_app

          ADMIN_TOKEN="$(admin_login | token_from_json)"
          CITIZEN_TOKEN="$(curl -fsS -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'email=persistence-ci@example.invalid'             --data-urlencode 'password=PersistencePass123!'             "${BASE}/api/auth/login" | token_from_json)"

          curl -fsS             -H "Authorization: Bearer ${ADMIN_TOKEN}"             "${BASE}/api/sensors/stations/manage" >/tmp/persist-stations-after.json
          python - <<'PY'
          import json
          rows = json.load(open("/tmp/persist-stations-after.json"))
          station = next((row for row in rows if row["station_id"] == "NER-997"), None)
          assert station is not None, rows
          assert station["name"] == "Persistence CI Station", station
          assert station["is_active"] is True, station
          PY

          curl -fsS             -H "Authorization: Bearer ${CITIZEN_TOKEN}"             "${BASE}/api/reports" >/tmp/persist-reports-after.json
          REPORT_ID="${REPORT_ID}" python - <<'PY'
          import json, os
          rows = json.load(open("/tmp/persist-reports-after.json"))
          report_id = int(os.environ["REPORT_ID"])
          report = next((row for row in rows if row["id"] == report_id), None)
          assert report is not None, rows
          assert report["submitted_by"] == "persistence-ci@example.invalid", report
          assert report["attachment_filename"], report
          PY

          curl -fsS             -H "Authorization: Bearer ${CITIZEN_TOKEN}"             "${BASE}/api/reports/${REPORT_ID}/attachment"             -o /tmp/persistence-evidence-after.png
          python - <<'PY'
          from pathlib import Path
          data = Path("/tmp/persistence-evidence-after.png").read_bytes()
          assert data.startswith(b"\x89PNG\r\n\x1a\n"), data[:16]
          assert b"GeoShield persistence evidence" in data
          PY

          stop_app


  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789abcdef
      ENABLE_DEMO_USERS: "false"
      GEOSHIELD_ADMIN_EMAIL: e2e-admin@example.invalid
      GEOSHIELD_ADMIN_PASSWORD: StrongE2EAdminPassword123!
      GEOSHIELD_ADMIN_NAME: Browser E2E Admin
      AUTO_SEED_REFERENCE_DATA: "true"
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm ci --ignore-scripts
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-like application
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18082 >/tmp/geoshield-e2e.log 2>&1 &
          echo $! >/tmp/geoshield-e2e.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18082/api/health/ready >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/geoshield-e2e.pid)" 2>/dev/null; then
              cat /tmp/geoshield-e2e.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/geoshield-e2e.log
          exit 1

      - name: Browser end-to-end workflow
        env:
          E2E_BASE_URL: http://127.0.0.1:18082
          E2E_ADMIN_EMAIL: e2e-admin@example.invalid
          E2E_ADMIN_PASSWORD: StrongE2EAdminPassword123!
        run: npx playwright test --config=e2e/playwright.config.cjs

      - name: Print application log
        if: always()
        run: cat /tmp/geoshield-e2e.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/geoshield-e2e.pid ]; then
            kill "$(cat /tmp/geoshield-e2e.pid)" 2>/dev/null || true
          fi

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python dependency and static security audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
          pip check
          pip-audit -r requirements.txt
          bandit -r app -q -ll

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Desktop dependency security audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - name: Frontend dependency security audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate

  windows-verification:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Execute Windows preparation workflow
        shell: cmd
        run: call prepare-demo.bat

      - name: Execute Windows offline startup and smoke test
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "geoshield-offline.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "geoshield-offline.err.log"
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","start-offline.bat" -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health/ready" -TimeoutSec 2
                if ($health.status -eq "ready" -and $health.database -eq "connected") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $ready) {
              throw "GeoShield offline runtime did not become ready on Windows."
            }

            $login = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/auth/login" -ContentType "application/x-www-form-urlencoded" -Body @{
              email = "admin@geoshield.gov.in"
              password = "admin123"
            }
            if (-not $login.token) {
              throw "Windows offline demo login did not return a JWT."
            }

            $html = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 5
            if ($html.StatusCode -ne 200 -or $html.Content -notmatch "<!doctype html") {
              throw "Windows offline frontend did not load correctly."
            }

            $headers = @{ Authorization = "Bearer $($login.token)" }
            $reports = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/reports" -Headers $headers -TimeoutSec 5
            if ($null -eq $reports) {
              throw "Authenticated Windows API request failed."
            }
          }
          finally {
            cmd /c "taskkill /PID $($process.Id) /T /F" 2>$null | Out-Null
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }


  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build web application
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Generate and sync Capacitor Android project
        working-directory: frontend
        env:
          GEOSHIELD_ANDROID_DEV_TRANSPORT: "true"
        run: |
          npx cap add android
          npx cap sync android
          npm run android:debug-transport

      - name: Build Android debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Android local backend transport
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="frontend/android/app/src/main/assets/capacitor.config.json"
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("frontend/android/app/src/main/assets/capacitor.config.json").read_text())
          assert config["server"]["cleartext"] is True, config
          assert config["android"]["allowMixedContent"] is True, config
          PY

          MERGED_MANIFEST="$(find frontend/android/app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml -print -quit)"
          test -n "$MERGED_MANIFEST"
          grep -q 'android:usesCleartextTraffic="true"' "$MERGED_MANIFEST"

          MAIN_MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          ! grep -q 'android:usesCleartextTraffic="true"' "$MAIN_MANIFEST"

      - name: Verify Android package
        shell: bash
        run: |
          set -euo pipefail
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          echo "Android APK size: $(du -h "$APK" | cut -f1)"

  electron-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location

      - name: Install Electron dependencies
        run: npm ci

      - name: Prepare bundled Python runtime
        shell: pwsh
        run: ./scripts/prepare-electron-runtime.ps1

      - name: Build unpacked Electron application
        shell: pwsh
        run: npx electron-builder --win dir --x64 --publish never

      - name: Verify bundled backend runtime directly
        shell: pwsh
        run: |
          $resources = Resolve-Path "dist-electron/win-unpacked/resources"
          $python = Join-Path $resources "runtime/python/python.exe"
          $backend = Join-Path $resources "backend"
          $data = Join-Path $env:RUNNER_TEMP "geoshield-direct-runtime"
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          $env:APP_ENV = "demo"
          $env:ENABLE_DEMO_USERS = "true"
          $env:WEATHER_LIVE_ENABLED = "false"
          $env:MODEL_TRAINING_ENABLED = "false"
          $env:TRUST_PROXY_HEADERS = "false"
          $env:AUTO_SEED_REFERENCE_DATA = "true"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:DATABASE_URL = "sqlite:///$($data.Replace('\','/'))/geoshield.db"
          $env:REPORT_UPLOAD_DIR = Join-Path $data "uploads/reports"
          $env:MODEL_CACHE_DIR = Join-Path $data "models"
          $env:TRAINING_DATA_PATH = Join-Path $resources "datasets/processed/real_ner_training_data.csv"
          $env:SATELLITE_DATA_PATH = Join-Path $resources "datasets/processed/real_satellite_data.json"

          $stdout = Join-Path $env:RUNNER_TEMP "geoshield-direct.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "geoshield-direct.err.log"
          $process = Start-Process -FilePath $python -WorkingDirectory $backend -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","18084" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 75; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18084/api/health/ready" -TimeoutSec 2
                if ($health.status -eq "ready") { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Bundled backend runtime did not become ready."
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Smoke test packaged Electron backend
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist-electron/win-unpacked/GeoShield.exe"
          $userData = Join-Path $env:RUNNER_TEMP "geoshield-electron-user-data"
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          $env:GEOSHIELD_USER_DATA_DIR = $userData
          $stdout = Join-Path $env:RUNNER_TEMP "geoshield-electron.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "geoshield-electron.err.log"
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health/ready" -TimeoutSec 2
                if ($health.status -eq "ready" -and $health.database -eq "connected") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Packaged Electron backend did not become ready."
            }

            $login = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/auth/login" -ContentType "application/x-www-form-urlencoded" -Body @{
              email = "admin@geoshield.gov.in"
              password = "admin123"
            }
            if (-not $login.token) {
              throw "Packaged Electron runtime login failed."
            }

            $headers = @{ Authorization = "Bearer $($login.token)" }
            $stations = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/sensors/stations" -Headers $headers
            if ($stations.Count -lt 1) {
              throw "Packaged Electron runtime did not expose station data."
            }
          }
          finally {
            cmd /c "taskkill /PID $($process.Id) /T /F" 2>$null | Out-Null
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            $backendLog = Join-Path $userData "backend.log"
            if (Test-Path $backendLog) { Get-Content $backendLog }
          }

      - name: Build NSIS installer
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist-electron/GeoShield-*-Setup.exe" | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1MB) {
            throw "GeoShield NSIS installer was not produced correctly."
          }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

  disaster-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://geoshield:recovery_ci@127.0.0.1:5432/geoshield_recovery
      JWT_SECRET: recovery-jwt-secret-0123456789abcdef0123456789abcdef
      ENABLE_DEMO_USERS: "false"
      GEOSHIELD_ADMIN_EMAIL: recovery-admin@example.invalid
      GEOSHIELD_ADMIN_PASSWORD: StrongRecoveryAdminPassword123!
      GEOSHIELD_ADMIN_NAME: Recovery Admin
      AUTO_SEED_REFERENCE_DATA: "true"
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      REPORT_UPLOAD_DIR: /tmp/geoshield-recovery-uploads

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geoshield_recovery
          POSTGRES_USER: geoshield
          POSTGRES_PASSWORD: recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoshield -d geoshield_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and PostgreSQL client
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start GeoShield and create recovery marker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$REPORT_UPLOAD_DIR"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18083 >/tmp/geoshield-recovery.log 2>&1 &
          echo $! >/tmp/geoshield-recovery.pid

          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18083/api/health/ready >/dev/null; then break; fi
            sleep 1
          done

          ADMIN_TOKEN="$(curl -fsS -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode "email=$GEOSHIELD_ADMIN_EMAIL"             --data-urlencode "password=$GEOSHIELD_ADMIN_PASSWORD"             http://127.0.0.1:18083/api/auth/login | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')"

          curl -fsS -X POST             -H "Authorization: Bearer $ADMIN_TOKEN"             -H 'Content-Type: application/json'             -d '{"email":"recovery-citizen@example.invalid","name":"Recovery Citizen","password":"RecoveryCitizenPass123!","role":"citizen"}'             http://127.0.0.1:18083/api/users >/tmp/recovery-user.json

          CITIZEN_TOKEN="$(curl -fsS -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'email=recovery-citizen@example.invalid'             --data-urlencode 'password=RecoveryCitizenPass123!'             http://127.0.0.1:18083/api/auth/login | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')"

          python - <<'PY'
          from pathlib import Path
          Path("/tmp/recovery-evidence.png").write_bytes(
              b"\x89PNG\r\n\x1a\nGeoShield disaster recovery evidence"
          )
          PY

          curl -fsS -X POST             -H "Authorization: Bearer $CITIZEN_TOKEN"             -F 'report_type=crack'             -F 'description=Disaster recovery marker report before destructive database loss'             -F 'latitude=25.58'             -F 'longitude=91.89'             -F 'reporter_name=Recovery Citizen'             -F 'reporter_language=en'             -F 'attachment=@/tmp/recovery-evidence.png;type=image/png'             http://127.0.0.1:18083/api/reports >/tmp/recovery-report.json

          python -c 'import json; print(json.load(open("/tmp/recovery-report.json"))["report"]["id"])' >/tmp/recovery-report-id

          kill "$(cat /tmp/geoshield-recovery.pid)"
          wait "$(cat /tmp/geoshield-recovery.pid)" || true

      - name: Create and validate backup
        working-directory: backend
        run: |
          python scripts/backup_restore.py backup /tmp/geoshield-recovery.zip
          python scripts/backup_restore.py inspect /tmp/geoshield-recovery.zip
          test -s /tmp/geoshield-recovery.zip

      - name: Simulate total operational data loss
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=recovery_ci psql             -h 127.0.0.1 -U geoshield -d geoshield_recovery             -v ON_ERROR_STOP=1             -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          rm -rf "$REPORT_UPLOAD_DIR"
          test ! -e "$REPORT_UPLOAD_DIR"

      - name: Restore verified backup
        working-directory: backend
        run: |
          python scripts/backup_restore.py restore /tmp/geoshield-recovery.zip --force
          test -d "$REPORT_UPLOAD_DIR"

      - name: Verify recovered login report and evidence
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          AUTO_SEED_REFERENCE_DATA=false python -m uvicorn app.main:app --host 127.0.0.1 --port 18083 >/tmp/geoshield-recovered.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/geoshield-recovered.log || true' EXIT

          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18083/api/health/ready >/dev/null; then break; fi
            sleep 1
          done

          CITIZEN_TOKEN="$(curl -fsS -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'email=recovery-citizen@example.invalid'             --data-urlencode 'password=RecoveryCitizenPass123!'             http://127.0.0.1:18083/api/auth/login | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')"

          curl -fsS             -H "Authorization: Bearer $CITIZEN_TOKEN"             http://127.0.0.1:18083/api/reports >/tmp/recovered-reports.json

          REPORT_ID="$(cat /tmp/recovery-report-id)"
          REPORT_ID="$REPORT_ID" python - <<'PY'
          import json, os
          report_id = int(os.environ["REPORT_ID"])
          rows = json.load(open("/tmp/recovered-reports.json"))
          row = next((item for item in rows if item["id"] == report_id), None)
          assert row is not None, rows
          assert row["submitted_by"] == "recovery-citizen@example.invalid", row
          assert row["attachment_filename"], row
          PY

          curl -fsS             -H "Authorization: Bearer $CITIZEN_TOKEN"             "http://127.0.0.1:18083/api/reports/$REPORT_ID/attachment"             -o /tmp/recovered-evidence.png

          python - <<'PY'
          from pathlib import Path
          data = Path("/tmp/recovered-evidence.png").read_bytes()
          assert data.startswith(b"\x89PNG\r\n\x1a\n"), data[:16]
          assert b"GeoShield disaster recovery evidence" in data
          PY
