name: GeoShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: demo
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip check
          python -m compileall -q app

      - name: Verify desktop lockfile and JavaScript
        run: |
          npm ci --ignore-scripts
          npm run verify:desktop
          npm audit --audit-level=high

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Docker build
        run: docker build -t geoshield:ci .

      - name: Production container smoke test
        shell: bash
        run: |
          set -euo pipefail
          JWT_SECRET_VALUE="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"

          docker run -d --name geoshield-ci \
            -p 127.0.0.1:8000:8000 \
            -e APP_ENV=production \
            -e JWT_SECRET="$JWT_SECRET_VALUE" \
            -e ENABLE_DEMO_USERS=false \
            -e GEOSHIELD_ADMIN_EMAIL=ci-admin@example.invalid \
            -e GEOSHIELD_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e WEATHER_LIVE_ENABLED=false \
            -e MODEL_TRAINING_ENABLED=false \
            geoshield:ci

          cleanup() {
            docker logs geoshield-ci || true
            docker rm -f geoshield-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "GeoShield container did not become healthy"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8000/api/dashboard/stats >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/sensors/stations >/dev/null

          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"latitude":25.58,"longitude":91.89}' \
            http://127.0.0.1:8000/api/predict >/dev/null

          curl --fail --silent \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'email=ci-admin@example.invalid' \
            --data-urlencode "password=$ADMIN_PASSWORD" \
            http://127.0.0.1:8000/api/auth/login >/dev/null
