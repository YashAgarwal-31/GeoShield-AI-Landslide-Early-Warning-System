name: GeoShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: demo
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip check
          python -m compileall -q app

      - name: Verify desktop lockfile and JavaScript
        run: |
          npm ci --ignore-scripts
          npm run verify:desktop
          npm audit --audit-level=high

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Docker build
        run: docker build -t geoshield:ci .

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name geoshield-smoke \
            -p 127.0.0.1:18000:8000 \
            -e APP_ENV=production \
            -e JWT_SECRET=ci-runtime-secret-0123456789abcdef0123456789abcdef \
            -e ENABLE_DEMO_USERS=false \
            -e GEOSHIELD_ADMIN_EMAIL=runtime-admin@example.invalid \
            -e GEOSHIELD_ADMIN_PASSWORD=runtime-ci-admin-password-12345 \
            -e AUTO_SEED_REFERENCE_DATA=true \
            -e WEATHER_LIVE_ENABLED=false \
            -e MODEL_TRAINING_ENABLED=false \
            -e TRUST_PROXY_HEADERS=false \
            geoshield:ci

          cleanup() {
            docker logs geoshield-smoke || true
            docker rm -f geoshield-smoke || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/api/health/ready >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          with open("/tmp/health.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["status"] == "ready", data
          assert data["database"] == "connected", data
          PY

          curl -fsS http://127.0.0.1:18000/ >/tmp/index.html
          grep -qi "<!doctype html" /tmp/index.html

          curl -fsS http://127.0.0.1:18000/api/dashboard/stats >/tmp/dashboard.json
          python - <<'PY'
          import json
          with open("/tmp/dashboard.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["total_stations"] == 20, data
          assert "risk_distribution" in data, data
          PY

          curl -fsS \
            -H "Content-Type: application/json" \
            -d '{"latitude":25.58,"longitude":91.89}' \
            http://127.0.0.1:18000/api/predict >/tmp/predict.json
          python - <<'PY'
          import json
          with open("/tmp/predict.json", encoding="utf-8") as f:
              data = json.load(f)
          assessment = data["risk_assessment"]
          assert 0 <= assessment["risk_score"] <= 100, assessment
          assert assessment["risk_level"] in {"low", "moderate", "high", "critical"}, assessment
          PY

          unauth_code=$(curl -sS -o /tmp/unauth.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"station_id":"NER-001","intensity":"high"}' \
            http://127.0.0.1:18000/api/simulate/landslide)
          test "$unauth_code" = "401"

          demo_login_code=$(curl -sS -o /tmp/login.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "email=admin%40geoshield.gov.in&password=admin123" \
            http://127.0.0.1:18000/api/auth/login)
          test "$demo_login_code" = "401"

          docker inspect -f '{{.State.Running}}' geoshield-smoke | grep -qx true

      - name: Production container smoke test
        shell: bash
        run: |
          set -euo pipefail
          JWT_SECRET_VALUE="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"

          docker run -d --name geoshield-ci \
            -p 127.0.0.1:8000:8000 \
            -e APP_ENV=production \
            -e JWT_SECRET="$JWT_SECRET_VALUE" \
            -e ENABLE_DEMO_USERS=false \
            -e GEOSHIELD_ADMIN_EMAIL=ci-admin@example.invalid \
            -e GEOSHIELD_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e AUTO_SEED_REFERENCE_DATA=true \
            -e WEATHER_LIVE_ENABLED=false \
            -e MODEL_TRAINING_ENABLED=false \
            geoshield:ci

          cleanup() {
            docker logs geoshield-ci || true
            docker rm -f geoshield-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "GeoShield container did not become healthy"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8000/api/dashboard/stats >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/sensors/stations >/dev/null

          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"latitude":25.58,"longitude":91.89}' \
            http://127.0.0.1:8000/api/predict >/dev/null

          curl --fail --silent \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'email=ci-admin@example.invalid' \
            --data-urlencode "password=$ADMIN_PASSWORD" \
            http://127.0.0.1:8000/api/auth/login >/dev/null


  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://geoshield:geoshield_ci@127.0.0.1:5432/geoshield_ci
      JWT_SECRET: ci-postgres-jwt-secret-0123456789abcdef0123456789abcdef
      ENABLE_DEMO_USERS: "false"
      GEOSHIELD_ADMIN_EMAIL: ci-admin@example.invalid
      GEOSHIELD_ADMIN_PASSWORD: StrongCiAdminPassword123!
      GEOSHIELD_ADMIN_NAME: CI Admin
      AUTO_SEED_REFERENCE_DATA: "true"
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      SENSOR_INGEST_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geoshield_ci
          POSTGRES_USER: geoshield
          POSTGRES_PASSWORD: geoshield_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoshield -d geoshield_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip check

      - name: PostgreSQL migration and operational tests
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m pytest tests/test_operational_core.py -q

      - name: Verify persistence across application restart
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          APP_PID=""
          PORT=18081
          BASE="http://127.0.0.1:${PORT}"
          LOG="/tmp/geoshield-persistence.log"

          stop_app() {
            if [ -n "${APP_PID}" ] && kill -0 "${APP_PID}" 2>/dev/null; then
              kill "${APP_PID}"
              wait "${APP_PID}" || true
            fi
            APP_PID=""
          }

          cleanup() {
            stop_app
            cat "${LOG}" || true
          }
          trap cleanup EXIT

          start_app() {
            : >"${LOG}"
            python -m uvicorn app.main:app --host 127.0.0.1 --port "${PORT}" >"${LOG}" 2>&1 &
            APP_PID=$!
            for attempt in $(seq 1 40); do
              if curl -fsS "${BASE}/api/health/ready" >/dev/null; then
                return
              fi
              if ! kill -0 "${APP_PID}" 2>/dev/null; then
                cat "${LOG}"
                exit 1
              fi
              sleep 1
            done
            cat "${LOG}"
            echo "GeoShield did not become ready"
            exit 1
          }

          admin_login() {
            curl -fsS -X POST               -H 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode "email=${GEOSHIELD_ADMIN_EMAIL}"               --data-urlencode "password=${GEOSHIELD_ADMIN_PASSWORD}"               "${BASE}/api/auth/login"
          }

          token_from_json() {
            python -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          }

          start_app
          ADMIN_TOKEN="$(admin_login | token_from_json)"

          curl -fsS -X POST             -H "Authorization: Bearer ${ADMIN_TOKEN}"             -H 'Content-Type: application/json'             -d '{"station_id":"NER-997","name":"Persistence CI Station","latitude":25.60,"longitude":91.90,"state":"Meghalaya","district":"East Khasi Hills","village":"Persistence Village","elevation":1200,"slope_angle":32,"soil_type":"loamy","vegetation_cover":55}'             "${BASE}/api/sensors/stations" >/tmp/persist-station.json

          curl -fsS -X POST             -H "Authorization: Bearer ${ADMIN_TOKEN}"             -H 'Content-Type: application/json'             -d '{"email":"persistence-ci@example.invalid","name":"Persistence Citizen","password":"PersistencePass123!","role":"citizen"}'             "${BASE}/api/users" >/tmp/persist-user.json

          CITIZEN_TOKEN="$(curl -fsS -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'email=persistence-ci@example.invalid'             --data-urlencode 'password=PersistencePass123!'             "${BASE}/api/auth/login" | token_from_json)"

          python - <<'PY'
          from pathlib import Path
          Path("/tmp/persistence-evidence.png").write_bytes(
              b"\x89PNG\r\n\x1a\nGeoShield persistence evidence"
          )
          PY

          curl -fsS -X POST             -H "Authorization: Bearer ${CITIZEN_TOKEN}"             -F 'report_type=crack'             -F 'description=Persistent slope crack report created before application restart'             -F 'latitude=25.58'             -F 'longitude=91.89'             -F 'reporter_name=Persistence Citizen'             -F 'reporter_language=en'             -F 'attachment=@/tmp/persistence-evidence.png;type=image/png'             "${BASE}/api/reports" >/tmp/persist-report.json

          REPORT_ID="$(python -c 'import json; print(json.load(open("/tmp/persist-report.json"))["report"]["id"])')"

          stop_app
          start_app

          ADMIN_TOKEN="$(admin_login | token_from_json)"
          CITIZEN_TOKEN="$(curl -fsS -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'email=persistence-ci@example.invalid'             --data-urlencode 'password=PersistencePass123!'             "${BASE}/api/auth/login" | token_from_json)"

          curl -fsS             -H "Authorization: Bearer ${ADMIN_TOKEN}"             "${BASE}/api/sensors/stations/manage" >/tmp/persist-stations-after.json
          python - <<'PY'
          import json
          rows = json.load(open("/tmp/persist-stations-after.json"))
          station = next((row for row in rows if row["station_id"] == "NER-997"), None)
          assert station is not None, rows
          assert station["name"] == "Persistence CI Station", station
          assert station["is_active"] is True, station
          PY

          curl -fsS             -H "Authorization: Bearer ${CITIZEN_TOKEN}"             "${BASE}/api/reports" >/tmp/persist-reports-after.json
          REPORT_ID="${REPORT_ID}" python - <<'PY'
          import json, os
          rows = json.load(open("/tmp/persist-reports-after.json"))
          report_id = int(os.environ["REPORT_ID"])
          report = next((row for row in rows if row["id"] == report_id), None)
          assert report is not None, rows
          assert report["submitted_by"] == "persistence-ci@example.invalid", report
          assert report["attachment_filename"], report
          PY

          curl -fsS             -H "Authorization: Bearer ${CITIZEN_TOKEN}"             "${BASE}/api/reports/${REPORT_ID}/attachment"             -o /tmp/persistence-evidence-after.png
          python - <<'PY'
          from pathlib import Path
          data = Path("/tmp/persistence-evidence-after.png").read_bytes()
          assert data.startswith(b"\x89PNG\r\n\x1a\n"), data[:16]
          assert b"GeoShield persistence evidence" in data
          PY

          stop_app
