services:
  - type: web
    name: geoshield
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_USERS
        value: "false"
      - key: GEOSHIELD_ADMIN_EMAIL
        value: admin@geoshield.local
      - key: GEOSHIELD_ADMIN_PASSWORD
        sync: false
      - key: WEATHER_LIVE_ENABLED
        value: "true"
      - key: MODEL_TRAINING_ENABLED
        value: "false"
      - key: ALLOW_SYNTHETIC_MODEL_FALLBACK
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
