services:
  geoshield:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Local-demo safe default: do not expose the demo service to the LAN.
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: demo
      DATABASE_URL: sqlite:////app/data/geoshield.db
      WEATHER_LIVE_ENABLED: "false"
      MODEL_TRAINING_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"
      ENABLE_DEMO_USERS: "true"
    volumes:
      - geoshield_data:/app/data
    restart: unless-stopped

volumes:
  geoshield_data:
